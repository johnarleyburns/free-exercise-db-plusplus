name: Build Free Exercise DB++

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "free-exercise-db-plusplus.schema.json"
      - "workout.schema.json"
      - "workout-plan.schema.json"
      - "volume-target.schema.json"
      - "interop-mapping.schema.json"
      - "exercise-interop-mapping.schema.json"
      - "mapping-loss.schema.json"
      - "mappings/**"
      - "src/interop/**"
      - "reports/interop/**"
      - "README.md"
      - "docs/**"
      - "packages/swift/**"
      - "packages/python/**"
      - "packages/kotlin/**"
      - "packages/r/**"
      - ".github/workflows/build-db.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "free-exercise-db-plusplus.schema.json"
      - "workout.schema.json"
      - "workout-plan.schema.json"
      - "volume-target.schema.json"
      - "interop-mapping.schema.json"
      - "exercise-interop-mapping.schema.json"
      - "mapping-loss.schema.json"
      - "mappings/**"
      - "src/interop/**"
      - "reports/interop/**"
      - "README.md"
      - "docs/**"
      - "packages/swift/**"
      - "packages/python/**"
      - "packages/kotlin/**"
      - "packages/r/**"
      - ".github/workflows/build-db.yml"
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Download upstream Free Exercise DB
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json \
            --output exercises.json
          python - <<'PY'
          import json
          x=json.load(open("exercises.json"))
          assert isinstance(x,list) and len(x)>500
          print("upstream exercises:",len(x))
          PY

      - name: Check upstream ID compatibility
        run: python src/check_upstream_compatibility.py exercises.json free-exercise-db-plusplus.json

      - name: Build and validate DB++
        run: |
          python src/convert_fedb_to_fedbpp.py \
            exercises.json \
            free-exercise-db-plusplus.json \
            --schema free-exercise-db-plusplus.schema.json \
            --completeness full

      - name: Validate embedded evidence references
        run: |
          python - <<'PY'
          import json
          db=json.load(open("free-exercise-db-plusplus.json"))
          known=set(db["metadata"]["evidence"]["patterns"])
          missing=set()
          for rec in db["exercises"].values():
              for ref in rec["annotation"].get("evidenceRefs",[]):
                  if ref.startswith("pattern:") and ref.split(":",1)[1] not in known:
                      missing.add(ref)
          assert not missing, f"Missing evidence entries: {sorted(missing)}"
          assert db["metadata"]["setCredits"] == {
              "direct":1.0, "indirect":0.5, "stabilizer":0.0
          }
          print("embedded evidence and set-credit model valid")
          PY

      - name: Verify reproducible build
        run: |
          python src/verify_reproducible_build.py exercises.json \
            --schema free-exercise-db-plusplus.schema.json

      - name: Verify release contract
        run: python tests/test_release_contract.py free-exercise-db-plusplus.json

      - name: Verify golden mappings
        run: python tests/test_golden_mappings.py free-exercise-db-plusplus.json

      - name: Verify medium-confidence policy
        run: python tests/test_medium_policy.py free-exercise-db-plusplus.json

      - name: Validate workout schema and fixture contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path("workout.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          valid = sorted(Path("examples/workouts").glob("*.json"))
          invalid = sorted(Path("fixtures/workout").glob("*.json"))
          assert len(valid) >= 10 and len(invalid) >= 3
          for path in valid:
              errors = list(validator.iter_errors(json.loads(path.read_text())))
              assert not errors, f"{path}: {errors}"
          for path in invalid:
              assert list(validator.iter_errors(json.loads(path.read_text()))), path
          print(f"workout schema valid; {len(valid)} valid and {len(invalid)} invalid fixtures checked")
          PY

      - name: Validate Workout PLAN schema and examples
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = "tests/plan/test_schema.py"
          spec = importlib.util.spec_from_file_location("plan_schema_tests", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for name in dir(module):
              if name.startswith("test_"):
                  getattr(module, name)()
          path = "tests/plan/test_examples.py"
          spec = importlib.util.spec_from_file_location("plan_example_tests", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for name in dir(module):
              if name.startswith("test_"):
                  getattr(module, name)()
          print("Workout PLAN schema and examples valid")
          PY

      - name: Validate TARGET schema and coverage analysis
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib.util
          for path in ("tests/target/test_schema.py", "tests/analysis/test_coverage.py", "tests/analysis/test_plan_compare.py", "tests/analysis/test_export.py", "tests/analysis/test_plan_actual.py", "tests/analysis/test_semantic_hardening.py", "tests/analysis/test_units_policies.py"):
              spec = importlib.util.spec_from_file_location(path.replace("/", "_"), path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              for name in dir(module):
                  if name.startswith("test_"):
                      getattr(module, name)()
          print("TARGET schema and coverage analysis valid")
          PY

      - name: Test ACTUAL 0.2 to 0.3 migration
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib.util
          path = "tests/workout/test_migration.py"
          spec = importlib.util.spec_from_file_location("workout_migration_tests", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for name in dir(module):
              if name.startswith("test_"):
                  getattr(module, name)()
          print("ACTUAL migration and optional PLAN linkage valid")
          PY

      - name: Test PLAN versus ACTUAL adherence
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib.util
          path = "tests/analysis/test_plan_actual.py"
          spec = importlib.util.spec_from_file_location("plan_actual_tests", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for name in dir(module):
              if name.startswith("test_"):
                  getattr(module, name)()
          print("PLAN versus ACTUAL matching and adherence valid")
          PY

      - name: Validate Garmin FIT mapping registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          mapping = json.loads(Path("mappings/garmin-fit.json").read_text())
          assert mapping["target"] == "garmin-fit"
          assert mapping["mappingVersion"] == "0.1.0"
          entries = mapping["entries"]
          assert len(entries) >= 10
          assert len({entry["sourcePath"] for entry in entries}) == len(entries)
          assert {entry["quality"] for entry in entries} <= {"exact", "compatible", "lossy", "extension_required", "unsupported"}
          print(f"Garmin FIT mapping valid: {len(entries)} entries")
          PY

      - name: Validate Apple HealthKit mapping registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          mapping = json.loads(Path("mappings/healthkit.json").read_text())
          assert mapping["target"] == "apple-healthkit"
          assert mapping["mappingVersion"] == "0.1.0"
          entries = mapping["entries"]
          assert len(entries) >= 10
          assert len({(e["sourcePath"], e["targetField"]) for e in entries}) == len(entries)
          assert {e["quality"] for e in entries} <= {"exact", "compatible", "lossy", "extension_required", "unsupported"}
          print(f"Apple HealthKit mapping valid: {len(entries)} entries")
          PY

      - name: Validate Android Health Connect mapping registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          mapping = json.loads(Path("mappings/health-connect.json").read_text())
          assert mapping["target"] == "android-health-connect"
          assert mapping["mappingVersion"] == "0.1.0"
          entries = mapping["entries"]
          assert len(entries) >= 10
          assert len({(e["sourcePath"], e["targetField"]) for e in entries}) == len(entries)
          assert {e["quality"] for e in entries} <= {"exact", "compatible", "lossy", "extension_required", "unsupported"}
          print(f"Android Health Connect mapping valid: {len(entries)} entries")
          PY

      - name: Validate typed interoperability artifacts
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from src.interop.validate import validate_all
          errors, warnings = validate_all("mappings", "free-exercise-db-plusplus.json", "interop-mapping.schema.json", "exercise-interop-mapping.schema.json", "mapping-loss.schema.json")
          assert not errors, errors
          print(f"typed mapping artifacts valid; review warnings: {len(warnings)}")
          loss=json.loads(Path("fixtures/interop/health-connect/unmapped-rir.json").read_text())["loss"]
          from jsonschema import Draft202012Validator, FormatChecker
          schema=json.loads(Path("mapping-loss.schema.json").read_text())
          assert not list(Draft202012Validator(schema,format_checker=FormatChecker()).iter_errors(loss))
          PY

      - name: Verify canonical identity mapping package parity
        run: |
          cmp mappings/garmin-fit-exercises.json packages/python/fedbpp/interop_data/garmin-fit-exercises.json
          cmp mappings/health-connect-exercises.json packages/python/fedbpp/interop_data/health-connect-exercises.json

      - name: Run v1.2 interoperability contract tests
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib.util, inspect
          from pathlib import Path
          total = 0
          for index, path in enumerate(sorted(Path("tests/interop").glob("test_*.py"))):
              spec = importlib.util.spec_from_file_location(f"interop_contract_{index}", path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              for name in sorted(dir(module)):
                  function = getattr(module, name)
                  if name.startswith("test_") and callable(function) and not inspect.signature(function).parameters:
                      function()
                      total += 1
          print(f"v1.2 interoperability contract valid: {total} tests")
          PY

      - name: Test Python consumer package
        run: |
          PYTHONPATH=packages/python:. python - <<'PY'
          import importlib.util, inspect
          from pathlib import Path
          total = 0
          for index, path in enumerate(sorted(Path("packages/python/tests").glob("test_*.py"))):
              spec = importlib.util.spec_from_file_location(f"fedbpp_tests_{index}", path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              for name in sorted(dir(module)):
                  function = getattr(module, name)
                  if name.startswith("test_") and callable(function) and not inspect.signature(function).parameters:
                      function()
                      total += 1
          print(f"Python consumer package valid: {total} tests")
          PY

      - name: Test isolated Python wheel
        run: |
          python3 -m pip wheel --no-deps packages/python --wheel-dir "${RUNNER_TEMP}/fedbpp-dist"
          python3 -m pip install --no-deps --target "${RUNNER_TEMP}/fedbpp-site" "${RUNNER_TEMP}"/fedbpp-dist/fedbpp-*.whl
          cd "${RUNNER_TEMP}"
          PYTHONPATH="${RUNNER_TEMP}/fedbpp-site" python3 -S -c 'import sys; sys.path.insert(0, sys.argv[1]); from fedbpp import Plan, VolumeTarget, analyze_plan, compare_plans, compare_to_targets, compare_plan_actual' "${RUNNER_TEMP}/fedbpp-site"

      - name: Test v1.3 conversion and CLI from isolated wheel
        run: |
          cd "${RUNNER_TEMP}"
          PYTHONPATH="${RUNNER_TEMP}/fedbpp-site" python3 -S - <<'PY'
          import json, os, sys
          sys.path.insert(0, "${RUNNER_TEMP}/fedbpp-site")
          from fedbpp import import_workout, export_workout
          source = json.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"], "examples/interop/python/fhir-input.json")))
          actual = import_workout("fhir", source)
          exported = export_workout("fhir", actual.document)
          assert actual.status == "lossless" and exported.status == "lossless"
          assert exported.document == export_workout("fhir", actual.document).document
          print("isolated wheel conversion passed")
          PY
          PYTHONPATH="${RUNNER_TEMP}/fedbpp-site" python3 -m fedbpp.cli --help >/dev/null

      - name: Test Swift 6 consumer package
        run: |
          swift test --package-path packages/swift/FreeExerciseDBPlusPlus

      - name: Test Kotlin consumer package
        run: |
          gradle --no-daemon test --project-dir packages/kotlin/fedbpp

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Test R research package
        run: |
          Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
          cd packages/r/fedbpp
          Rscript tests/test_package.R

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Generate review reports
        run: |
          python src/generate_review_report.py free-exercise-db-plusplus.json \
            --markdown reports/REVIEW.md \
            --csv reports/review-queue.csv \
            --json reports/review-summary.json

      - name: Generate evidence audit
        run: |
          python src/generate_evidence_audit.py free-exercise-db-plusplus.json \
            --out reports/EVIDENCE-AUDIT.md

      - name: Assert evidence-confidence consistency
        run: |
          python - <<'PY'
          import json
          db=json.load(open("free-exercise-db-plusplus.json"))
          evidence=db["metadata"]["evidence"]["patterns"]
          errors=[]
          for rec in db["exercises"].values():
              ann=rec["annotation"]
              for p in ann.get("patterns", []):
                  status=evidence[p]["status"]
                  if status=="supported" and ann["confidence"]!="high":
                      errors.append((rec["exerciseId"],p,status,ann["confidence"]))
                  if status in {"complex_supported","indirect_support"} and ann["confidence"]=="high":
                      errors.append((rec["exerciseId"],p,status,ann["confidence"]))
          assert not errors, f"Evidence/confidence mismatches: {errors[:20]}"
          print("evidence/confidence policy consistent")
          PY

      - name: Assert all used patterns have evidence
        run: |
          python - <<'PY'
          import json
          db=json.load(open("free-exercise-db-plusplus.json"))
          evidence=db["metadata"]["evidence"]["patterns"]
          used=set()
          for rec in db["exercises"].values():
              used.update(rec["annotation"].get("patterns", []))
          provisional=sorted(p for p in used if evidence[p]["status"]=="provisional")
          assert not provisional, f"Used provisional patterns remain: {provisional}"
          print(f"all {len(used)} used patterns have non-provisional evidence")
          PY

      - name: Generate rule audit
        run: |
          python src/generate_rule_audit.py free-exercise-db-plusplus.json \
            --out reports/RULE-AUDIT.md

      - name: Generate exercise-specific mapping audit
        run: |
          python src/generate_mapping_audit.py free-exercise-db-plusplus.json \
            --markdown reports/MAPPING-AUDIT.md \
            --csv reports/mapping-audit.csv

      - name: Generate fallback audit
        run: |
          python src/generate_fallback_audit.py free-exercise-db-plusplus.json \
            --out reports/FALLBACK-AUDIT.md

      - name: Assert full build
        run: |
          python - <<'PY'
          import json
          db=json.load(open("free-exercise-db-plusplus.json"))
          m=db["metadata"]
          assert m["completeness"]=="full"
          assert m["sourceExerciseCount"]==m["outputExerciseCount"]
          assert m["outputExerciseCount"]>500
          print(json.dumps({
              "schemaVersion":m["schemaVersion"],
              "converterVersion":m["converterVersion"],
              "exerciseCount":m["outputExerciseCount"],
              "setCredits":m["setCredits"]
          },indent=2))
          PY

      - name: Upload generated DB++ and audits
        uses: actions/upload-artifact@v4
        with:
          name: free-exercise-db-plusplus-build
          if-no-files-found: error
          retention-days: 30
          path: |
            free-exercise-db-plusplus.json
            free-exercise-db-plusplus.schema.json
            workout.schema.json
            workout-plan.schema.json
            volume-target.schema.json
            reports/**

      - name: Commit generated public outputs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-exercise-db-plusplus.json reports/
          if git diff --cached --quiet; then
            echo "Generated outputs are unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "build: regenerate Free Exercise DB++ [skip ci]"
          git push
