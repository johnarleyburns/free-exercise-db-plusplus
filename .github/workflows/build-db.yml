name: Build Free Exercise DB++

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "convert_fedb_to_fedbpp.py"
      - "generate_review_report.py"
      - "generate_evidence_audit.py"
      - "generate_rule_audit.py"
      - "generate_mapping_audit.py"
      - "generate_fallback_audit.py"
      - "free-exercise-db-plusplus.schema.json"
      - "verify_reproducible_build.py"
      - "tests/**"
      - "README.md"
      - "METHODOLOGY.md"
      - "VERSIONING.md"
      - "workout.schema.json"
      - "EVIDENCE.md"
      - "COMPATIBILITY.md"
      - "tests/test_medium_policy.py"
      - "tests/test_golden_mappings.py"
      - "check_upstream_compatibility.py"
      - ".github/workflows/build-db.yml"
  pull_request:
    paths:
      - "convert_fedb_to_fedbpp.py"
      - "generate_review_report.py"
      - "generate_evidence_audit.py"
      - "generate_rule_audit.py"
      - "generate_mapping_audit.py"
      - "generate_fallback_audit.py"
      - "free-exercise-db-plusplus.schema.json"
      - "verify_reproducible_build.py"
      - "tests/**"
      - "README.md"
      - "METHODOLOGY.md"
      - "VERSIONING.md"
      - "workout.schema.json"
      - "EVIDENCE.md"
      - "COMPATIBILITY.md"
      - "tests/test_medium_policy.py"
      - "tests/test_golden_mappings.py"
      - "check_upstream_compatibility.py"
      - ".github/workflows/build-db.yml"
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Download upstream Free Exercise DB
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json --output exercises.json
          python - <<'PY'
          import json
          x=json.load(open("exercises.json"))
          assert isinstance(x,list) and len(x)>500
          print("upstream exercises:",len(x))
          PY
      - name: Check upstream ID compatibility
        run: python check_upstream_compatibility.py exercises.json free-exercise-db-plusplus.json
      - name: Build and validate DB++
        run: |
          python convert_fedb_to_fedbpp.py exercises.json free-exercise-db-plusplus.json             --schema free-exercise-db-plusplus.schema.json --completeness full
      - name: Validate embedded evidence references
        run: |
          python - <<'PY'
          import json
          db=json.load(open("free-exercise-db-plusplus.json"))
          known=set(db["metadata"]["evidence"]["patterns"])
          missing=set()
          for rec in db["exercises"].values():
              for ref in rec["annotation"].get("evidenceRefs",[]):
                  if ref.startswith("pattern:") and ref.split(":",1)[1] not in known:
                      missing.add(ref)
          assert not missing, f"Missing evidence entries: {sorted(missing)}"
          assert db["metadata"]["setCredits"] == {"direct":1.0,"indirect":0.5,"stabilizer":0.0}
          print("embedded evidence and set-credit model valid")
          PY
      - name: Verify reproducible build
        run: |
          python verify_reproducible_build.py exercises.json \
            --schema free-exercise-db-plusplus.schema.json
      - name: Verify release contract
        run: python tests/test_release_contract.py free-exercise-db-plusplus.json
      - name: Verify golden mappings
        run: python tests/test_golden_mappings.py free-exercise-db-plusplus.json
      - name: Verify medium-confidence policy
        run: python tests/test_medium_policy.py free-exercise-db-plusplus.json
      - name: Validate workout interchange schema
        run: python -c 'import json; from jsonschema import Draft202012Validator; Draft202012Validator.check_schema(json.load(open("workout.schema.json"))); print("workout schema valid")'
      - name: Generate review reports
        run: |
          python generate_review_report.py free-exercise-db-plusplus.json             --markdown REVIEW.md --csv review-queue.csv --json review-summary.json
      - name: Generate evidence audit
        run: python generate_evidence_audit.py free-exercise-db-plusplus.json --out EVIDENCE-AUDIT.md
      - name: Assert evidence-confidence consistency
        run: |
          python - <<'PY'
          import json
          db=json.load(open("free-exercise-db-plusplus.json"))
          evidence=db["metadata"]["evidence"]["patterns"]
          errors=[]
          for rec in db["exercises"].values():
              ann=rec["annotation"]
              for p in ann.get("patterns", []):
                  status=evidence[p]["status"]
                  if status=="supported" and ann["confidence"]!="high":
                      errors.append((rec["exerciseId"],p,status,ann["confidence"]))
                  if status in {"complex_supported","indirect_support"} and ann["confidence"]=="high":
                      errors.append((rec["exerciseId"],p,status,ann["confidence"]))
          assert not errors, f"Evidence/confidence mismatches: {errors[:20]}"
          print("evidence/confidence policy consistent")
          PY
      - name: Assert all used patterns have evidence
        run: |
          python - <<'PY'
          import json
          db=json.load(open("free-exercise-db-plusplus.json"))
          evidence=db["metadata"]["evidence"]["patterns"]
          used=set()
          for rec in db["exercises"].values():
              used.update(rec["annotation"].get("patterns", []))
          provisional=sorted(p for p in used if evidence[p]["status"]=="provisional")
          assert not provisional, f"Used provisional patterns remain: {provisional}"
          print(f"all {len(used)} used patterns have non-provisional evidence")
          PY
      - name: Generate rule audit
        run: python generate_rule_audit.py free-exercise-db-plusplus.json --out RULE-AUDIT.md
      - name: Generate exercise-specific mapping audit
        run: |
          python generate_mapping_audit.py free-exercise-db-plusplus.json             --markdown MAPPING-AUDIT.md --csv mapping-audit.csv
      - name: Generate fallback audit
        run: python generate_fallback_audit.py free-exercise-db-plusplus.json --out FALLBACK-AUDIT.md
      - name: Assert full build
        run: |
          python - <<'PY'
          import json
          db=json.load(open("free-exercise-db-plusplus.json"))
          m=db["metadata"]
          assert m["completeness"]=="full"
          assert m["sourceExerciseCount"]==m["outputExerciseCount"]
          assert m["outputExerciseCount"]>500
          print(json.dumps({
              "schemaVersion":m["schemaVersion"],
              "converterVersion":m["converterVersion"],
              "exerciseCount":m["outputExerciseCount"],
              "setCredits":m["setCredits"]
          },indent=2))
          PY
      - name: Upload generated DB++ and audit report
        uses: actions/upload-artifact@v4
        with:
          name: free-exercise-db-plusplus-build
          if-no-files-found: error
          retention-days: 30
          path: |
            free-exercise-db-plusplus.json
            REVIEW.md
            review-queue.csv
            review-summary.json
            EVIDENCE-AUDIT.md
            RULE-AUDIT.md
            MAPPING-AUDIT.md
            mapping-audit.csv
            FALLBACK-AUDIT.md
      - name: Commit generated public outputs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-exercise-db-plusplus.json REVIEW.md review-queue.csv review-summary.json EVIDENCE-AUDIT.md RULE-AUDIT.md MAPPING-AUDIT.md mapping-audit.csv FALLBACK-AUDIT.md
          if git diff --cached --quiet; then
            echo "Generated outputs are unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "build: regenerate Free Exercise DB++ [skip ci]"
          git push
