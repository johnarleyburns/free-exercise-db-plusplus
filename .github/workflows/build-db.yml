name: Build Free Exercise DB++

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "convert_fedb_to_fedbpp.py"
      - "generate_review_report.py"
      - "free-exercise-db-plusplus.schema.json"
      - ".github/workflows/build-db.yml"

  pull_request:
    paths:
      - "convert_fedb_to_fedbpp.py"
      - "generate_review_report.py"
      - "free-exercise-db-plusplus.schema.json"
      - ".github/workflows/build-db.yml"

  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: |
          python -m pip install --disable-pip-version-check jsonschema

      - name: Download upstream Free Exercise DB
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json \
            --output exercises.json

          python - <<'PY'
          import json

          with open("exercises.json", "r", encoding="utf-8") as f:
              exercises = json.load(f)

          assert isinstance(exercises, list)
          assert len(exercises) > 500, (
              f"Unexpectedly small upstream dataset: {len(exercises)}"
          )

          print("Upstream exercises:", len(exercises))
          PY

      - name: Preserve previous generated timestamp
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("free-exercise-db-plusplus.json")

          if not path.exists():
              print("No previous generated DB found.")
              raise SystemExit(0)

          try:
              db = json.loads(path.read_text(encoding="utf-8"))
              generated_at = db["metadata"]["generatedAt"]
          except Exception as exc:
              print(f"Could not read previous generatedAt: {exc}")
              raise SystemExit(0)

          Path(".previous-generated-at").write_text(
              generated_at,
              encoding="utf-8",
          )

          print("Previous generatedAt:", generated_at)
          PY

      - name: Build and validate DB++
        run: |
          python convert_fedb_to_fedbpp.py \
            exercises.json \
            free-exercise-db-plusplus.json \
            --schema free-exercise-db-plusplus.schema.json \
            --completeness full

      - name: Generate review reports
        run: |
          python generate_review_report.py \
            free-exercise-db-plusplus.json \
            --markdown REVIEW.md \
            --csv review-queue.csv \
            --json review-summary.json

      - name: Assert full build
        run: |
          python - <<'PY'
          import json

          with open(
              "free-exercise-db-plusplus.json",
              "r",
              encoding="utf-8",
          ) as f:
              db = json.load(f)

          metadata = db["metadata"]

          assert metadata["completeness"] == "full"
          assert (
              metadata["sourceExerciseCount"]
              == metadata["outputExerciseCount"]
          )
          assert metadata["outputExerciseCount"] > 500

          print(
              json.dumps(
                  {
                      "exerciseCount": metadata["outputExerciseCount"],
                      "converterVersion": metadata["converterVersion"],
                      "sourceSha256": metadata["upstream"]["sha256"],
                  },
                  indent=2,
              )
          )
          PY

      - name: Avoid timestamp-only changes
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          old_timestamp_path = Path(".previous-generated-at")
          current_path = Path("free-exercise-db-plusplus.json")

          if not old_timestamp_path.exists():
              print("No previous timestamp to preserve.")
              raise SystemExit(0)

          previous_timestamp = old_timestamp_path.read_text(
              encoding="utf-8"
          ).strip()

          new_db = json.loads(
              current_path.read_text(encoding="utf-8")
          )

          try:
              old_db = json.loads(
                  __import__("subprocess").check_output(
                      [
                          "git",
                          "show",
                          "HEAD:free-exercise-db-plusplus.json",
                      ],
                      text=True,
                  )
              )
          except Exception:
              print("No previous committed DB to compare.")
              raise SystemExit(0)

          old_db["metadata"]["generatedAt"] = "__TIMESTAMP__"
          new_db["metadata"]["generatedAt"] = "__TIMESTAMP__"

          if old_db == new_db:
              print(
                  "Generated DB is semantically unchanged; "
                  "preserving previous generatedAt."
              )

              actual_db = json.loads(
                  current_path.read_text(encoding="utf-8")
              )
              actual_db["metadata"]["generatedAt"] = previous_timestamp

              current_path.write_text(
                  json.dumps(
                      actual_db,
                      indent=2,
                      ensure_ascii=False,
                  ) + "\n",
                  encoding="utf-8",
              )
          else:
              print("Generated DB contains substantive changes.")
          PY

      - name: Upload generated DB++ and audit report
        uses: actions/upload-artifact@v4
        with:
          name: free-exercise-db-plusplus-build
          if-no-files-found: error
          retention-days: 30
          path: |
            free-exercise-db-plusplus.json
            REVIEW.md
            review-queue.csv
            review-summary.json

      - name: Commit generated public outputs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            free-exercise-db-plusplus.json \
            REVIEW.md \
            review-queue.csv \
            review-summary.json

          if git diff --cached --quiet; then
            echo "Generated outputs are unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "build: regenerate Free Exercise DB++ [skip ci]"
          git push

