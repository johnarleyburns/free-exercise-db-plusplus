name: Build Free Exercise DB++

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "convert_fedb_to_fedbpp.py"
      - "generate_review_report.py"
      - "free-exercise-db-plusplus.schema.json"
      - ".github/workflows/build-db.yml"
  pull_request:
    paths:
      - "convert_fedb_to_fedbpp.py"
      - "generate_review_report.py"
      - "free-exercise-db-plusplus.schema.json"
      - ".github/workflows/build-db.yml"
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Download upstream Free Exercise DB
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json \
            --output exercises.json
          python - <<'PY'
          import json
          x=json.load(open("exercises.json"))
          assert isinstance(x,list) and len(x)>500
          print("upstream exercises:",len(x))
          PY
      - name: Build and validate DB++
        run: |
          python convert_fedb_to_fedbpp.py exercises.json free-exercise-db-plusplus.json \
            --schema free-exercise-db-plusplus.schema.json --completeness full
      - name: Generate review reports
        run: |
          python generate_review_report.py free-exercise-db-plusplus.json \
            --markdown REVIEW.md --csv review-queue.csv --json review-summary.json
      - name: Assert full build
        run: |
          python - <<'PY'
          import json
          db=json.load(open("free-exercise-db-plusplus.json"))
          m=db["metadata"]
          assert m["completeness"]=="full"
          assert m["sourceExerciseCount"]==m["outputExerciseCount"]
          assert m["outputExerciseCount"]>500
          print(json.dumps(m,indent=2))
          PY
      - name: Upload generated DB++ and audit report
        uses: actions/upload-artifact@v4
        with:
          name: free-exercise-db-plusplus-build
          if-no-files-found: error
          retention-days: 30
          path: |
            free-exercise-db-plusplus.json
            REVIEW.md
            review-queue.csv
            review-summary.json
