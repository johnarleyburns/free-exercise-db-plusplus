name: Release Free Exercise DB++

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Download current upstream
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json \
            --output exercises.json

      - name: Require tagged release to match reviewed upstream snapshot
        run: |
          python - <<'PY'
          import hashlib, json
          committed=json.load(open("free-exercise-db-plusplus.json"))
          actual=hashlib.sha256(open("exercises.json","rb").read()).hexdigest()
          expected=committed["metadata"]["upstream"]["sha256"]
          assert actual == expected, (
              "Upstream changed since the reviewed build. "
              "Run the normal build/review workflow and commit outputs before tagging."
          )
          print("release input matches committed upstream SHA-256")
          PY

      - name: Validate committed release database
        run: |
          python src/convert_fedb_to_fedbpp.py \
            exercises.json \
            /tmp/rebuilt.json \
            --schema free-exercise-db-plusplus.schema.json \
            --completeness full
          python tests/test_release_contract.py free-exercise-db-plusplus.json
          python tests/test_golden_mappings.py free-exercise-db-plusplus.json
          python tests/test_medium_policy.py free-exercise-db-plusplus.json
          python src/verify_reproducible_build.py exercises.json \
            --schema free-exercise-db-plusplus.schema.json

      - name: Create checksums
        run: |
          sha256sum \
            free-exercise-db-plusplus.json \
            free-exercise-db-plusplus.schema.json \
            workout.schema.json > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Free Exercise DB++ ${GITHUB_REF_NAME}" \
            --generate-notes \
            free-exercise-db-plusplus.json \
            free-exercise-db-plusplus.schema.json \
            workout.schema.json \
            SHA256SUMS \
            docs/METHODOLOGY.md \
            docs/COMPATIBILITY.md \
            docs/EVIDENCE.md
