name: Release Free Exercise DB++

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require successful normal CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow build-db.yml --commit "$GITHUB_SHA" --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          test "$conclusion" = success || {
            echo "No successful normal CI run is associated with tagged commit $GITHUB_SHA" >&2
            exit 1
          }

      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Download current upstream
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json \
            --output exercises.json

      - name: Require tagged release to match reviewed upstream snapshot
        run: |
          python - <<'PY'
          import hashlib, json
          committed=json.load(open("free-exercise-db-plusplus.json"))
          actual=hashlib.sha256(open("exercises.json","rb").read()).hexdigest()
          expected=committed["metadata"]["upstream"]["sha256"]
          assert actual == expected, (
              "Upstream changed since the reviewed build. "
              "Run the normal build/review workflow and commit outputs before tagging."
          )
          print("release input matches committed upstream SHA-256")
          PY

      - name: Validate committed release database
        run: |
          python src/convert_fedb_to_fedbpp.py \
            exercises.json \
            /tmp/rebuilt.json \
            --schema free-exercise-db-plusplus.schema.json \
            --completeness full
          python tests/test_release_contract.py free-exercise-db-plusplus.json
          python tests/test_golden_mappings.py free-exercise-db-plusplus.json
          python tests/test_medium_policy.py free-exercise-db-plusplus.json
          python src/verify_reproducible_build.py exercises.json \
            --schema free-exercise-db-plusplus.schema.json

      - name: Validate public JSON artifacts and schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          def load(name):
              return json.loads(Path(name).read_text())
          schemas = {
              'database': load('free-exercise-db-plusplus.schema.json'),
              'workout': load('workout.schema.json'),
              'plan': load('workout-plan.schema.json'),
              'target': load('volume-target.schema.json'),
              'interop': load('interop-mapping.schema.json'),
              'exercise_interop': load('exercise-interop-mapping.schema.json'),
              'loss': load('mapping-loss.schema.json'),
              'relationships': load('exercise-relationships.schema.json'),
              'profile': load('training-profile.schema.json'),
              'intent': load('workout-intent.schema.json'),
              'family_mapping': load('family-interop-mapping.schema.json'),
          }
          for schema in schemas.values():
              Draft202012Validator.check_schema(schema)
          checks = [('database', 'free-exercise-db-plusplus.json')]
          for schema_name, directory in [('workout', 'examples/workouts'), ('plan', 'examples/plans'), ('target', 'examples/targets')]:
              checks.extend((schema_name, str(path)) for path in sorted(Path(directory).glob('*.json')))
          for schema_name, filename in checks:
              validator = Draft202012Validator(schemas[schema_name], format_checker=FormatChecker())
              errors = list(validator.iter_errors(load(filename)))
              assert not errors, f'{filename}: {[error.message for error in errors]}'
          profile_validator = Draft202012Validator(schemas['profile'], format_checker=FormatChecker())
          for filename in sorted(Path('examples/training-profiles').glob('*.json')):
              errors = list(profile_validator.iter_errors(load(str(filename))))
              assert not errors, f'{filename}: {[error.message for error in errors]}'
          print(f'validated {len(checks)} public JSON artifacts against their schemas')
          for filename, schema_name in [('exercise-relationships.json','relationships'), ('fixtures/interop/family-mapping-example.json','family_mapping')]:
              errors=list(Draft202012Validator(schemas[schema_name], format_checker=FormatChecker()).iter_errors(load(filename)))
              assert not errors, (filename, errors)
          PY

      - name: Validate v1.10 WorkoutIntent fixtures
        run: |
          PYTHONPATH=packages/python:. python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('v110_tests','tests/training/test_v110.py')
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          for name in dir(module):
              if name.startswith('test_'): getattr(module,name)()
          print('v1.10 WorkoutIntent fixtures passed')
          PY

      - name: Validate typed interoperability artifacts and loss fixtures
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from src.interop.validate import validate_all, validate_loss
          errors, warnings = validate_all("mappings", "free-exercise-db-plusplus.json", "interop-mapping.schema.json", "exercise-interop-mapping.schema.json", "mapping-loss.schema.json")
          assert not errors, errors
          loss = json.loads(Path("fixtures/interop/health-connect/unmapped-rir.json").read_text())["loss"]
          assert not validate_loss(loss, Path("mapping-loss.schema.json"))
          assert Path("mappings/garmin-fit-exercises.json").read_bytes() == Path("packages/python/fedbpp/interop_data/garmin-fit-exercises.json").read_bytes()
          print(f"typed interoperability artifacts valid; review warnings: {len(warnings)}")
          PY

      - name: Create checksums
        run: |
          sha256sum \
            free-exercise-db-plusplus.json \
            free-exercise-db-plusplus.schema.json \
            workout.schema.json \
            workout-plan.schema.json \
            volume-target.schema.json \
            training-profile.schema.json \
            workout-intent.schema.json \
            coach-decision.schema.json \
            interop-mapping.schema.json \
            exercise-interop-mapping.schema.json \
            mapping-loss.schema.json \
            exercise-relationships.json \
            exercise-relationships.schema.json \
            family-interop-mapping.schema.json > SHA256SUMS
          (cd reports/interop && sha256sum garmin-fit-families.json) >> SHA256SUMS
          (cd reports/relationships && sha256sum summary.json) >> SHA256SUMS

      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            free-exercise-db-plusplus.json \
            free-exercise-db-plusplus.schema.json \
            workout.schema.json \
            workout-plan.schema.json \
            volume-target.schema.json \
            training-profile.schema.json \
            workout-intent.schema.json \
            coach-decision.schema.json \
            interop-mapping.schema.json \
            exercise-interop-mapping.schema.json \
            mapping-loss.schema.json \
            exercise-relationships.json \
            exercise-relationships.schema.json \
            family-interop-mapping.schema.json \
            reports/interop/garmin-fit-families.json \
            reports/relationships/summary.json \
            reports/relationships/v1.5-conformance.md \
            mappings/garmin-fit-exercises.json \
            mappings/health-connect-exercises.json \
            mappings/garmin-fit.json \
            mappings/fhir-exercises.json \
            reports/interop/android-health-connect.json \
            docs/interop/IMPORT-EXPORT.md \
            docs/interop/CLI.md \
            docs/EXERCISE-RELATIONSHIPS.md \
            SHA256SUMS \
            docs/METHODOLOGY.md \
            docs/COMPATIBILITY.md \
            docs/ANALYSIS-SEMANTICS.md \
            docs/WORKOUT-INTERCHANGE.md \
            docs/WORKOUT-PLAN.md \
            docs/PLAN-ANALYSIS.md \
            docs/PLAN-ACTUAL.md \
            docs/PLAN-COMPARISON.md \
            docs/VOLUME-TARGETS.md \
            docs/TRAINING-PROFILE.md \
            docs/WORKOUT-INTENT.md \
            docs/GOAL-RESOLUTION.md \
            docs/ENVIRONMENT-PROFILES.md \
            docs/LANGUAGE-CAPABILITIES.md \
            docs/PLAN-EVALUATION.md \
            docs/TRAINING-STATE.md \
            docs/PROGRESSION-POLICIES.md \
            docs/COACH-DECISIONS.md
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Free Exercise DB++ ${GITHUB_REF_NAME}" \
              --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Free Exercise DB++ ${GITHUB_REF_NAME}" \
              --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
              "${assets[@]}"
          fi
