[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedbpp"
version = "1.4.1"
description = "Python helpers for Free Exercise DB++"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fedbpp = "fedbpp.cli:main"

[project.optional-dependencies]
validation = ["jsonschema>=4.20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fedbpp*"]
exclude = ["tests*", "build*", "fedbpp.__pycache__*", "fedbpp.*.__pycache__*"]
namespaces = false

[tool.setuptools.package-data]
fedbpp = ["schemas/*.json", "interop_data/*.json"]
